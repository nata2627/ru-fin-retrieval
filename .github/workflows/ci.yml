# Тесты и проверка стиля на каждый пуш.
#
# Ставится только основной набор зависимостей плюс dev: ни torch, ни faiss
# здесь не нужны, потому что тесты не трогают плотный поиск — он считается
# на видеокарте. Благодаря этому прогон занимает меньше минуты.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить пакет
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Проверка стиля
        run: ruff check src tests scripts kaggle

      - name: Тесты
        run: pytest
